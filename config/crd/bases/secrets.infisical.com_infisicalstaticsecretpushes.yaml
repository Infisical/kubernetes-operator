  names:
    kind: InfisicalStaticSecretPush
    listKind: InfisicalStaticSecretPushList
    plural: infisicalstaticsecretpushes
    singular: infisicalstaticsecretpush
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="secrets.infisical.com/LastReconcileAuthMethod")].message
      name: Auth Method
      type: string
    - jsonPath: .status.conditions[?(@.type=="secrets.infisical.com/LastReconcileStatus")].status
      name: Synced
      type: string
    - jsonPath: .status.error
      name: Error
      type: boolean
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: InfisicalStaticSecretPush pushes Kubernetes Secrets to one or
          more paths in Infisical.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              infisicalAuthRef:
                description: The InfisicalAuth used to push. Defaults to the "default"
                  InfisicalAuth in the operator namespace.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              sources:
                description: |-
                  The Kubernetes Secrets to push. Every key of every source is pushed to every target,
                  except to a target with a template, which pushes what its template renders instead.
                properties:
                  secrets:
                    description: |-
                      Kubernetes Secrets to push. When several Secrets contain the same key, the
                      Secret listed first wins.
                    items:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    minItems: 1
                    type: array
                required:
                - secrets
                type: object
              syncOptions:
                default: {}
                properties:
                  createMissingFolders:
                    default: true
                    description: Creates the target folder, and any missing parent
                      folders, when it doesn't exist.
                    type: boolean
                  deletionPolicy:
                    default: Delete
                    description: |-
                      Delete removes pushed secrets from Infisical when their key is removed from the
                      sources, when their target is removed, or when this resource is deleted.
                      None never deletes secrets from Infisical.
                    enum:
                    - Delete
                    - None
                    type: string
                  refreshInterval:
                    description: |-
                      How often to push again, e.g. 60s, 5m, 1h. The minimum is 5s. When omitted, the
                      operator pushes only when a source Secret or this resource changes.
                    type: string
                  updatePolicy:
                    default: Replace
                    description: |-
                      Whether keys that already exist in Infisical are updated. Replace keeps them in
                      sync with the sources and takes over keys created outside this resource. None only
                      creates missing keys and never changes an existing one, including the keys this
                      resource created, so later changes to the sources don't reach Infisical. A key
                      another InfisicalStaticSecretPush pushed is never changed.
                    enum:
                    - Replace
                    - None
                    type: string
                type: object
              targets:
                description: The Infisical paths to push to.
                items:
                  properties:
                    environmentSlug:
                      type: string
                    projectId:
                      description: The Infisical project ID. Set either projectId
                        or projectSlug.
                      type: string
                    projectSlug:
                      description: The Infisical project slug. Set either projectId
                        or projectSlug.
                      type: string
                    secretPath:
                      description: The folder to push to, e.g. /app. The root is /.
                      type: string
                    template:
                      description: |-
                        Renders the secrets pushed to this target from the source keys, which are then
                        not pushed as they are. Each source key is available as .KEY.Value, and
                        .KEY.SecretPath is this target's secretPath.
                      properties:
                        data:
                          description: |-
                            Data defines the templated output. It accepts either a map of per-key
                            Go templates (each entry becomes one key in the resulting Secret /
                            ConfigMap) or a single Go template string whose rendered output is
                            YAML-decoded into a map of key/value pairs.
                          x-kubernetes-preserve-unknown-fields: true
                        engineVersion:
                          enum:
                          - v1
                          type: string
                      required:
                      - data
                      - engineVersion
                      type: object
                  required:
                  - environmentSlug
                  - secretPath
                  type: object
                minItems: 1
                type: array
            required:
            - sources
            - targets
            type: object
          status:
            description: InfisicalStaticSecretPushStatus defines the observed state
              of InfisicalStaticSecretPush
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                description: |-
                  Error is true when the last reconciliation failed. The failure details are in the
                  secrets.infisical.com/LastReconcileStatus condition. Only trust this value once
                  observedGeneration matches metadata.generation.
                type: boolean
              managedSecrets:
                additionalProperties:
                  type: string
                description: |-
                  ManagedSecrets maps the ID of every secret this resource pushed to Infisical to
                  its key. Only these secrets are ever deleted by the operator.
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent metadata.generation the operator has reconciled.
                  When it is lower than metadata.generation, the status does not yet reflect the current spec.
                format: int64
                type: integer
            required:
            - conditions
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
