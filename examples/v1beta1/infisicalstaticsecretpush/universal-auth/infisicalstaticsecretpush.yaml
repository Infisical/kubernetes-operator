# 1. Kubernetes secret holding the client credentials
apiVersion: v1
kind: Secret
metadata:
  name: universal-auth-credentials
  namespace: default
type: Opaque
stringData:
  clientId: <your-identity-client-id> # replace this
  clientSecret: <your-identity-client-secret> # replace this
---
# 2. Connection to the Infisical instance
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: my-infisical-connection
  namespace: default
spec:
  address: https://app.infisical.com
---
# 3. Auth using Universal Auth credentials
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: my-infisical-auth
  namespace: default
spec:
  infisicalConnectionRef:
    name: my-infisical-connection
    namespace: default
  method: universal
  universal:
    clientIdRef:
      name: universal-auth-credentials
      namespace: default
      key: clientId
    clientSecretRef:
      name: universal-auth-credentials
      namespace: default
      key: clientSecret
---
# 4. Kubernetes Secret to push to Infisical
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: <your-db-password> # replace this
  API_KEY: <your-api-key> # replace this
---
# 5. Push the Kubernetes Secret to Infisical
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecretPush
metadata:
  name: my-static-secret-push
  namespace: default
spec:
  infisicalAuthRef:
    name: my-infisical-auth
    namespace: default
  syncOptions:
    refreshInterval: 60s
  sources:
    secrets:
      - name: app-credentials
        namespace: default
  targets:
    - projectId: <your-project-id> # replace this
      environmentSlug: dev
      secretPath: /app
